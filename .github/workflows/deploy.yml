name: CI & Deployment Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Verify Pranayama Patterns & DTW Loader
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import pranayama_dtw as d; print(len(d.PATTERNS), d.LOAD_PROBLEMS); assert len(d.PATTERNS) == 10 and not d.LOAD_PROBLEMS"

      - name: Run Root Server Smoke Test
        run: |
          python main.py &
          SERVER_PID=$!
          sleep 4
          curl -f http://127.0.0.1:8000/health || exit 1
          curl -f http://127.0.0.1:8000/patterns || exit 1
          curl -f http://127.0.0.1:8000/sensor/sample || exit 1
          kill $SERVER_PID

      - name: Check JavaScript Syntax
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node --check frontend/app.js
          node --check frontend/coach_client.js
